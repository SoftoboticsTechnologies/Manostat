<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<script src="_ds/modernist-a969e3ec-0fac-439e-8ff7-f6b457d517c2/_ds_bundle.js"></script>
<link rel="stylesheet" href="brand.css">
<link rel="icon" type="image/png" href="assets/manostat_logo-bg.png">
<script src="site.js"></script>
</helmet>
<header style="position:sticky;top:0;z-index:60;background:#fff;border-bottom:2px solid var(--color-divider)">
  <div style="width:100%;margin:0 auto;padding:0 clamp(16px,3vw,32px);display:flex;align-items:center;gap:20px;min-height:92px">
    <a href="index.html" aria-label="Manostat Talent Solutions, home" style="display:flex;align-items:center;gap:12px;text-decoration:none;padding:16px 0;flex:none">
      <img src="assets/manostat%20logo.jpeg" alt="Manostat Talent Solutions" style="height:clamp(52px,6vw,64px);width:auto;max-width:100%;object-fit:contain;display:block">
      <span style="font-family:var(--font-heading);font-weight:800;font-size:clamp(15px,1.6vw,19px);letter-spacing:-.01em;color:var(--navy);line-height:1.15;white-space:nowrap">Manostat Talent Solutions</span>
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav style="flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="10">
          <a href="{{ item.href }}" style="position:relative;display:flex;align-items:center;height:92px;white-space:nowrap;text-decoration:none;font-size:11.5px;font-weight:600;letter-spacing:.035em;text-transform:uppercase;color:var(--ink-70);padding:0 5px;transition:color .2s ease" style-hover="color:var(--navy)">
            {{ item.label }}
            <sc-if value="{{ item.on }}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;left:3px;right:3px;bottom:0;height:3px;background:var(--teal)"></span>
            </sc-if>
          </a>
        </sc-for>
      </nav>
      <a href="Contact.dc.html" class="btn btn-primary" style="flex:none;padding:13px 18px;letter-spacing:.06em;text-transform:uppercase;font-size:12px;white-space:nowrap">Get Started</a>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggle }}" aria-label="Menu" style="margin-left:auto;flex:none;width:48px;height:48px;display:grid;place-items:center;background:var(--navy);color:#fff;border:0;border-radius:4px;cursor:pointer;transition:background .2s ease" style-hover="background:var(--color-accent-600)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:2px solid var(--color-divider);background:var(--color-surface);padding:8px clamp(20px,4vw,44px) 22px;display:grid;gap:0">
      <sc-for list="{{ nav }}" as="item" hint-placeholder-count="4">
        <a href="{{ item.href }}" style="display:block;padding:13px 2px;text-decoration:none;font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text);border-bottom:1px solid var(--line)">{{ item.label }}</a>
      </sc-for>
      <a href="Contact.dc.html" class="btn btn-primary" style="margin-top:16px;padding:14px 18px;letter-spacing:.06em;text-transform:uppercase">Get Started</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, w: 1400 };
  componentDidMount() {
    const set = () => this.setState({ w: window.innerWidth, open: window.innerWidth > 1260 ? false : this.state.open });
    set();
    this._set = set;
    window.addEventListener('resize', set);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._set); }
  renderVals() {
    const active = this.props.active || '';
    const items = [
      ['Home', 'index.html'], ['About', 'About.dc.html'], ['Services', 'Services.dc.html'],
      ['Industries', 'Industries.dc.html'], ['Process', 'Process.dc.html'], ['Employers', 'Employers.dc.html'],
      ['Job Seekers', 'JobSeekers.dc.html'], ['Clients', 'Clients.dc.html'], ['Careers', 'Careers.dc.html'],
      ['Contact', 'Contact.dc.html']
    ];
    const wide = this.state.w > 1260;
    return {
      wide, narrow: !wide, open: this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open })),
      nav: items.map(([label, href]) => ({ label, href, on: href.replace('.dc.html', '') === active }))
    };
  }
}
</script>
</body>
</html>
